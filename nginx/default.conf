map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Redirect requests made using an IP address or a non-canonical hostname.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Keep container health checks local instead of following the public redirect.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 308 https://www.pichchamroeun.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.pichchamroeun.com;
    server_tokens off;
    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ~ ^/api(?:/|$) {
        proxy_pass http://expressjs:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
