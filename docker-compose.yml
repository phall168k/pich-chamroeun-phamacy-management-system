services:
  expressjs:
    build:
      context: ./backend
      target: development
    init: true
    environment:
      NODE_ENV: development
      PORT: 4000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_BUCKET: pharmacy
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
    volumes:
      - ./backend/src:/app/src
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [app]

  next:
    build:
      context: ./frontend
      target: development
    init: true
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://expressjs:4000
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/public:/app/public
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [app]

  minio:
    build: ./minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/live]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]

  nginx:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:${HTTP_PORT:-8000}:80'
    volumes:
      - ./nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      expressjs:
        condition: service_healthy
      next:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [app]

volumes:
  minio_data:

networks:
  app:
